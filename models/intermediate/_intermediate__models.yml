
version: 2

models:
  - name: int_order_payments_summary
    description: >
      Aggregates raw payment transactions to one-row-per-order.
      Resolves fan-out problem for joining to fct_orders.
      Supports Phase 3 Req #3 (Finance payment analysis).
    columns:
      - name: order_id
        description: "Primary key at order grain. Unique after aggregation."
        tests:
          - unique
          - not_null
      - name: total_payment_value
        description: "Sum of all payment transactions for the order."
        tests:
          - not_null
      - name: max_installments
        description: "Highest installment count across all payment methods."
      - name: payment_record_count
        description: "Number of payment rows per order — anomaly detection."

  - name: int_delivery_performance
    description: >
      Calculates delivery delay and SLA breach flags per order.
      Supports Phase 3 Req #1 (Logistics Manager SLA dashboard).
      NULL values for undelivered/canceled orders are intentional.
    columns:
      - name: order_id
        description: "Primary key. One row per order."
        tests:
          - unique
          - not_null
      - name: delivery_delay_days
        description: >
          Days between estimated and actual delivery.
          Positive = late, Negative = early, NULL = not yet delivered.
      - name: is_on_time_delivery
        description: "TRUE if delivered on/before estimated date. NULL if not delivered yet."
      - name: is_seller_sla_breach
        description: "TRUE if seller shipped after shipping_limit_date::date."

  - name: int_orders_joined
    description: >
      Wide model joining orders, items, products, sellers, categories
      at order-item grain. Primary input for fct_orders (Phase 5B).
    columns:
      - name: order_id
        description: "Order identifier. NOT unique here — order-item grain."
      - name: order_item_id
        description: "Line item number within an order."
        tests:
          - not_null
      - name: item_total_value
        description: "price + freight_value. GMV building block."
        tests:
          - not_null
      - name: product_category_name_english
        description: "English category name. Falls back to Portuguese if translation missing."
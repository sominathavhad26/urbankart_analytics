version: 2

models:
  - name: intermediate_orders
    description: "Intermediate model that harmonizes order events, payments, and shipping data for analytics."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
      - name: customer_id
        description: "Identifier for the customer who placed the order."
      - name: order_date
        description: "The date when the order was created."
      - name: order_status
        description: "Normalized order status for reporting."
      - name: total_amount
        description: "Total order amount after discounts and promotions."

  - name: intermediate_customers
    description: "Intermediate model that standardizes customer profiles and lifetime activity."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
      - name: customer_segment
        description: "Calculated customer segment for analytics and targeting."
      - name: first_order_date
        description: "Date of the customer's first order."
      - name: last_order_date
        description: "Date of the customer's most recent order."
      - name: lifetime_value
        description: "Customer lifetime value aggregated from orders."

  - name: intermediate_product_performance
    description: "Intermediate model that aggregates product sales, inventory, and conversion metrics."
    columns:
      - name: product_id
        description: "Unique identifier for each product."
      - name: units_sold
        description: "Total units sold in the reporting period."
      - name: revenue
        description: "Total revenue generated by the product."
      - name: average_price
        description: "Average selling price for the product."
      - name: stock_status
        description: "Current inventory status for the product."

  - name: intermediate_marketing_attribution
    description: "Intermediate attribution model linking marketing touchpoints to orders and revenue."
    columns:
      - name: attribution_id
        description: "Unique identifier for each attribution record."
      - name: order_id
        description: "Associated order for the attribution record."
      - name: channel
        description: "Marketing channel that influenced the order."
      - name: attributed_revenue
        description: "Revenue attributed to the marketing channel."
      - name: touchpoint_date
        description: "Date of the marketing interaction."
